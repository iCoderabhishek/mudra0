services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swarn
      POSTGRES_PASSWORD: swarn
      POSTGRES_DB: swarn
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarn -d swarn"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://swarn:swarn@db:5432/swarn
      TEST_DATABASE_URL: postgresql://swarn:swarn@db:5432/swarn_test
      REDIS_URL: redis://redis:6379
      # Local development default only. Set AUTH_SECRET in your shell for anything else.
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-not-a-real-secret}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3000:3000"

volumes:
  pgdata:
